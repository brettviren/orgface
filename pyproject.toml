[project]
name = "org-cli-helper"
version = "0.1.0"
description = "Do some Emacs org things quickly from the command line"
readme = {file = "README.org", content-type = "text/org"}
authors = [
    { name = "Brett Viren", email = "brett.viren@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
]

[project.scripts]
org-cli-helper = "org_cli_helper:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
org_cli_helper = ["*.el"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "emacs: needs a real Emacs with org-roam (deselect with -m 'not emacs')",
]
