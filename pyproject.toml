[project]
name = "orgface"
version = "0.1.0"
description = "Do some Emacs org things quickly from the command line"
readme = {file = "README.org", content-type = "text/org"}
authors = [
    { name = "Brett Viren", email = "brett.viren@gmail.com" }
]
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
    # Rendering is how a document's content hash is taken, so every
    # backend needs it, not only the one that writes org files.
    "jinja2>=3.1.6",
    "pydantic>=2.13.4",
]

[project.scripts]
orgface = "orgface:main"

[project.optional-dependencies]
orgfs = [
    "org-parser>=0.28.0",
    # 0.26.0 corrupts the heap while org-parser reads nodes and the process
    # segfaults on a document of any size; 0.25.x is fine.
    "tree-sitter>=0.25,<0.26",
]
semantic = [
    "sqlite-vec>=0.1.9",
]
service = [
    "fastapi>=0.141.1",
    "fastmcp>=3.4.7",
]
# Sources: the extra is named for the source it provides, see orgface.sources.
github = [
    "ghexport @ git+https://github.com/karlicoss/ghexport",
    "orger",
    "HPI[optional]",
]

[build-system]
# 77.0.3 is the first release supporting PEP 639 license expressions.
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
orgface = ["*.el"]
org_store = [
    "schemas/*.json",
    "render/templates/*.j2",
    "export/templates/*.j2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    # The tests cover every backend and both service front ends, so a
    # development area needs the extras a user picks and chooses.
    "orgface[orgfs,semantic,service,github]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "emacs: needs a real Emacs with org-roam (deselect with -m 'not emacs')",
    "embed: needs a running embedding model (deselect with -m 'not embed')",
]
